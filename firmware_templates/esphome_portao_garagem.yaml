# ==============================================================================
# iaparacasa - ESPHome YAML para Portão da Garagem (Contato Seco / Pulso 1000ms)
# ==============================================================================
# Compatível com Sonoff Basic / SV / Mini / RE5V1C / 4CH Pro.
# Segurança: restore_mode ALWAYS_OFF + auto-desligamento em 1000ms no próprio ESP.

esphome:
  name: portao-garagem
  friendly_name: Portao da Garagem

esp8266:
  board: esp01_1m

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Portao-Garagem-Fallback"

logger:

# API HTTP local de fallback (porta 80) — permite controle mesmo sem broker MQTT
web_server:
  port: 80

# Conexão direta ao container Mosquitto do iaparacasa
mqtt:
  broker: "<IP_DO_SERVIDOR>"
  port: 1883
  topic_prefix: portao_garagem

switch:
  - platform: gpio
    pin: GPIO12   # Pino padrão do relé na maioria dos Sonoffs (ajuste se usar 4CH/ESP32)
    id: portao_garagem
    name: "Portão da Garagem"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 1000ms
      - switch.turn_off: portao_garagem

button:
  - platform: template
    id: portao_pulso
    name: "Pulso Portão"
    on_press:
      - switch.turn_on: portao_garagem
